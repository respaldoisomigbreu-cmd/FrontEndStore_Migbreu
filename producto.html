<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle del producto en FrontEnd Store: elige tu talla y añade tu camiseta al carrito.">
    <title>FrontEnd Store - Producto</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header class="header">
        <a href="index.html" aria-label="FrontEnd Store - Ir al inicio">
            <img class="header__logo" src="img/logo.png" alt="Logotipo de FrontEnd Store">
        </a>
    </header>

    <nav class="navegacion" aria-label="Navegación principal">
        <div class="navegacion__grupo">
            <a class="navegacion__enlace" href="index.html">Tienda</a>
            <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        </div>
        <div class="navegacion__acciones">
            <a class="navegacion__carrito" href="carrito.html" data-cart-link aria-label="Ver carrito">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="navegacion__contador" data-cart-count hidden>0</span>
            </a>
            <a class="navegacion__admin" href="login.html" data-auth-link>Admin</a>
            <button class="navegacion__admin" type="button" data-logout hidden>Salir</button>
        </div>
    </nav>

    <main class="contenedor">
        <a class="boton boton--secundario volver" href="index.html">&larr; Volver al catálogo</a>

        <h1 id="producto-nombre">Cargando producto...</h1>

        <div class="camisa" id="producto-detalle">
            <img class="camisa__imagen" src="img/3.jpg" alt="Imagen del producto" id="producto-imagen">

            <div class="camisa__contenido">
                <p id="producto-descripcion"></p>
                <p class="camisa__precio" id="producto-precio"></p>

                <form class="formulario" id="formulario-producto">
                    <label class="formulario__label" for="talla">Talla</label>
                    <select class="formulario__campo" id="talla" name="talla" required>
                        <option value="" disabled selected>--Seleccionar talla--</option>
                    </select>

                    <label class="formulario__label" for="cantidad">Cantidad</label>
                    <input class="formulario__campo" id="cantidad" name="cantidad" type="number" placeholder="Cantidad" min="1" max="99" required>

                    <input class="formulario__submit" type="submit" value="Agregar al Carrito">
                </form>
                <p class="form-error" id="form-error" role="alert"></p>
            </div>
        </div>

        <div class="producto-no-encontrado" id="producto-no-encontrado" hidden>
            <p>El producto que buscas no existe.</p>
            <a class="producto-no-encontrado__enlace" href="index.html">Volver a la tienda</a>
        </div>
    </main>

    <footer class="footer">
        <p class="footer__texto">Front End Store - Todos Los Derechos Reservados
        <br> Miguel Abreu
        </p>
    </footer>

    <script src="js/productos.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/producto.js" defer></script>
</body>
</html>
