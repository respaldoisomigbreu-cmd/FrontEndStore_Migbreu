<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administración de FrontEnd Store: productos, precios, tallas y pedidos.">
    <title>FrontEnd Store - Panel de administración</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-guard" data-page="admin">
    <header class="header">
        <a href="index.html" aria-label="FrontEnd Store - Ir al inicio">
            <img class="header__logo" src="img/logo.png" alt="Logotipo de FrontEnd Store">
        </a>
    </header>

    <nav class="navegacion" aria-label="Navegación principal">
        <div class="navegacion__grupo">
            <a class="navegacion__enlace" href="index.html">Tienda</a>
            <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        </div>
        <div class="navegacion__acciones">
            <a class="navegacion__carrito" href="carrito.html" data-cart-link aria-label="Ver carrito">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="navegacion__contador" data-cart-count hidden>0</span>
            </a>
            <a class="navegacion__admin" href="admin.html" data-auth-link>Panel</a>
            <button class="navegacion__admin" type="button" data-logout hidden>Salir</button>
        </div>
    </nav>

    <main class="contenedor admin" id="admin-main">
        <h1>Panel de administración</h1>
        <p class="admin__sesion">Sesión iniciada como <strong data-auth-email></strong></p>

        <nav class="admin-menu" aria-label="Secciones del panel">
            <a class="admin-menu__enlace admin-menu__enlace--activo" href="admin.html" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
                <span>Productos</span>
            </a>
            <a class="admin-menu__enlace" href="admin-imagenes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
                <span>Imágenes</span>
            </a>
            <a class="admin-menu__enlace" href="admin-ventas.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M3 3v18h18"></path>
                    <path d="M7 15l4-4 3 3 5-6"></path>
                </svg>
                <span>Ventas</span>
            </a>
        </nav>

        <div class="admin__acciones">
            <button class="boton" type="button" id="nuevo-producto">Nuevo producto</button>
        </div>

        <h2>Productos</h2>
        <p class="admin__ayuda" id="admin-productos-total"></p>
        <div class="admin-lista" id="admin-lista"></div>
        <nav class="paginacion" id="admin-productos-paginacion" aria-label="Paginación de productos" hidden></nav>
    </main>

    <dialog class="modal" id="producto-dialog" aria-labelledby="modal-titulo">
        <form id="producto-form" class="modal__formulario">
            <div class="modal__contenido">
                <h2 class="modal__titulo" id="modal-titulo">Editar producto</h2>
                <input type="hidden" name="id">

                <div class="campo">
                    <label class="campo__label" for="nombre-producto">Nombre</label>
                    <input class="campo__input" type="text" id="nombre-producto" name="nombre" required maxlength="60">
                </div>

                <div class="campo">
                    <label class="campo__label" for="precio-producto">Precio (USD)</label>
                    <input class="campo__input" type="number" id="precio-producto" name="precio" min="0.01" step="0.01" required>
                </div>

                <div class="campo">
                    <label class="campo__label" for="descripcion-producto">Descripción</label>
                    <textarea class="campo__input campo__textarea" id="descripcion-producto" name="descripcion" rows="4" required maxlength="300"></textarea>
                </div>

                <div class="campo">
                    <label class="campo__label" for="imagen-archivo">Imagen del producto</label>
                    <input type="hidden" id="imagen-producto" name="imagen" value="">
                    <input class="campo__input campo__archivo" type="file" id="imagen-archivo" name="imagen_archivo" accept="image/jpeg,image/png,image/webp">
                    <p class="campo__ayuda">JPG, PNG o WebP. Tamano maximo: 5 MB.</p>
                    <img class="imagen-preview" id="imagen-preview" src="img/logo.png" alt="Vista previa de la imagen">
                </div>

                <fieldset class="campo campo--fieldset">
                    <legend class="campo__label">Tallas disponibles</legend>
                    <div class="tallas-grid">
                        <label class="talla-check"><input type="checkbox" name="tallas" value="S"> S</label>
                        <label class="talla-check"><input type="checkbox" name="tallas" value="M"> M</label>
                        <label class="talla-check"><input type="checkbox" name="tallas" value="L"> L</label>
                        <label class="talla-check"><input type="checkbox" name="tallas" value="XL"> XL</label>
                    </div>
                </fieldset>

                <p class="form-error" id="producto-error" role="alert"></p>

                <div class="modal__acciones">
                    <button class="boton boton--secundario" type="button" id="cancelar-producto">Cancelar</button>
                    <button class="boton" type="submit">Guardar producto</button>
                </div>
            </div>
        </form>
    </dialog>

    <footer class="footer">
        <p class="footer__texto">Front End Store - Todos Los Derechos Reservados 2025
        <br> Miguel Abreu
        </p>
    </footer>

    <script src="js/productos.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/admin-productos.js" defer></script>
</body>
</html>
